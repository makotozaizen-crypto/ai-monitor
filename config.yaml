# ============================================================
# AI検索 露出モニター 設定ファイル
# 変更したら GitHub 上でこのファイルを編集→保存するだけで次回から反映されます
# ============================================================

# ---- 当社ブランド（回答にこれが出たら「言及あり」） ----
brand:
  names:
    - 給湯器交換の匠
    - 交換の匠
    - Sanwatec
    - サンワテック
  domains:
    - sanwatec.net
    - sanwacreate.net
    - kyutokitakumi.jp

  # 類似名称の他社（出たら「混同注意」として記録）
  similar_names:
    - 給湯の匠
  similar_domains:
    - kyuto-takumi.com

  # 正しい情報（回答内の電話番号・住所がこれと違えば「要確認」）
  # ★ ハイフンありで入力してください。未入力なら電話番号チェックは行いません
  official_phones:
    - ""   # 例: 0120-000-000（寝屋川本店）
    - ""   # 例: 0120-000-000（大阪店・八尾）
  official_cities:
    - 寝屋川市
    - 八尾市

# ---- 毎週AIに聞く質問 ----
# 一般のお客さんが打ちそうな聞き方にしています。自由に増減OK（1問ごとに約4〜6円）
questions:
  # 本店エリア
  - 寝屋川市で給湯器交換を頼むならおすすめの業者はどこですか？
  - 寝屋川 給湯器 交換 安い 業者
  - 枚方市で給湯器が壊れました。すぐ交換してくれる業者を教えて
  - 門真市・守口市で評判のいい給湯器交換業者は？
  # 大阪店エリア
  - 八尾市で給湯器交換のおすすめ業者を教えてください
  - 八尾 エコキュート 交換 業者
  - 東大阪市で給湯器交換を頼める地元の業者は？
  - 柏原市・藤井寺市で給湯器交換してくれる業者はありますか？
  # 大阪全体
  - 大阪で給湯器交換のおすすめ業者を教えて
  - 大阪 給湯器 即日 交換
  - 大阪市で給湯器交換が安くて信頼できる業者は？
  - 大阪でエコキュートの交換を頼むならどこがいい？
  - 大阪 電気温水器 交換 業者 おすすめ
  - 大阪でハイブリッド給湯器に交換したい。どこに頼めばいい？
  - 給湯器のエラーが出てお湯が出ない。大阪で今日来てくれる業者は？
  - 大阪で給湯器交換の費用相場と、おすすめの業者を教えて
  # ブランド確認（混同・誤情報チェック用）
  - 給湯器交換の匠はどんな会社ですか？
  - 給湯器交換の匠の電話番号と店舗の場所を教えて
  - 給湯器交換の匠 八尾 店舗
  - 給湯器交換の匠の評判は？

# 同じ質問を何回聞くか（AIの答えは毎回少し変わるため。2にすると費用も2倍）
repeats: 1

# ---- 使うAIとモデル ----
# APIキーが登録されていないAIは自動でスキップします
providers:
  gemini:
    enabled: true
    model: gemini-flash-latest
  openai:
    enabled: true
    model: gpt-6-luna
  claude:
    enabled: true
    model: claude-haiku-5-5
    max_searches: 3
  perplexity:
    enabled: true
    model: perplexity/sonar

# 回答から業者名を抜き出す・週次の改善提案を書くAI（安いGeminiを使用）
analyzer:
  model: gemini-flash-latest

# ---- 費用計算用の単価（USD、だいたいの目安） ----
pricing:
  gemini:     {input_per_m: 0.75, output_per_m: 3.75, per_search: 0.0}
  openai:     {input_per_m: 0.10, output_per_m: 0.50, per_search: 0.01}
  claude:     {input_per_m: 0.10, output_per_m: 0.50, per_search: 0.01}
  perplexity: {input_per_m: 0.25, output_per_m: 2.50, per_search: 0.0025}
